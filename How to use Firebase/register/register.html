<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="container">
        <h2 id="form-title">Register</h2>
        <form id="register-form">
            <div class="input-group">
                <input type="text" class="inp-username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="email" class="inp-email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" class="inp-password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <input type="password" class="inp-cf-password" placeholder="Enter password again" required>
            </div>
            <button type="submit" id="register-button">Register</button>
            <p class="text-center mt-4">
                <span>Đã có tài khoản?</span>
                <a href="../login/login.html" class="ms-1">Đăng nhập</a>
            </p>
        </form>
    </div>

    <script src="register.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore-compat.js"></script>
    
    <script src="../firebase-config.js"></script>

    
</body>

</html>
